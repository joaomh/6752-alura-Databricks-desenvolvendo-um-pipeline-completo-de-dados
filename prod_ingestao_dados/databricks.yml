resources:
  jobs:
    prod_ingestao_dados:
      name: prod_ingestao_dados
      email_notifications:
        on_start:
          - seu_email
        on_failure:
          - seu_email
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/workspace/raw/bronze/input/
      tasks:
        - task_key: prod_ingestao_bronze
          notebook_task:
            notebook_path: /etl/etl_bronze.ipynb
            source: WORKSPACE
        - task_key: prod_ingestao_silver
          depends_on:
            - task_key: prod_ingestao_bronze
          notebook_task:
            notebook_path: /etl/etl_silver.ipynb
            source: WORKSPACE
        - task_key: prod_ingestao_gold
          depends_on:
            - task_key: prod_ingestao_silver
          notebook_task:
            notebook_path: /etl/etl_gold.ipynb
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
